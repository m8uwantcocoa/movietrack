  <style>
    .rating-spinner {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: conic-gradient(rgb(35, 0, 52) 0% 0%, rgb(0, 255, 255) 0% 50%, rgb(35, 0, 52) 50% 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .rating-spinner span {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #01161E;
    }
    .progress-bar {
  position: relative;
  background: linear-gradient(to right, cyan, purple);
  background-size: 300% 100%;
  animation: gradient-move 7.5s linear infinite;
  color: #ffffff;
  font-weight: bold;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 15px;
  height: 17px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
  overflow: hidden;
  transition: width 0.8s ease-in-out;
  padding: 0 10px;
}

@keyframes gradient-move {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}
    #movie-poster {
    max-height: 600px;
    max-width: 500px;
    object-fit: cover;
    }

  </style>
</head>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const movieTitle = localStorage.getItem('movieTitle');
    const selectedMovie = JSON.parse(localStorage.getItem('selectedMovie'));
    console.log(selectedMovie);
    console.log('Movie Title:', encodeURIComponent(movieTitle))
    if (selectedMovie) {
          document.getElementById('movie-title').textContent = selectedMovie.Title;
          document.getElementById('movie-description').textContent = selectedMovie.Plot;
          document.getElementById('movie-year').textContent = selectedMovie.Year;
          document.getElementById('movie-runtime').textContent = selectedMovie.Runtime;
          document.getElementById('movie-director').textContent = selectedMovie.Director;
          document.getElementById('movie-awards').textContent = selectedMovie.Awards;
          document.getElementById('movie-actors').textContent = selectedMovie.Actors;
          document.getElementById('movie-poster').src = selectedMovie.Poster;

          const rating = parseFloat(selectedMovie.imdbRating) || 0;
          const ratingSpinner = document.getElementById('movie-rating');
          const ratingPercentage = (rating / 10) * 100;
          ratingSpinner.style.background = `conic-gradient(rgb(0, 255, 255) 0% ${ratingPercentage}%, rgb(35, 0, 52) ${ratingPercentage}% 100%)`;
          ratingSpinner.querySelector('span').textContent = rating.toFixed(1);

        } else {
            console.log('No movie found in localStorage.');
            console.error('No movie title found in localStorage.');
    }
  });

    document.addEventListener('DOMContentLoaded', function() {
      const title = localStorage.getItem('movieTitle')
      fetch(`/api/movies/${encodeURIComponent(title)}`)

      .then(response => response.json())
      .then(data => {

        const albumsContainer = document.getElementById('albums-container');
        const albumTemplate = document.querySelector('.album-card-template');

        data.albums.forEach(album => {
          const albumElement = albumTemplate.cloneNode(true);
          albumElement.style.display = 'block';
          albumElement.querySelector('.album-image').src = album.imageUrl;
          albumElement.querySelector('.album-name').textContent = album.name;
          albumElement.querySelector('.album-release-date').textContent = `Release Date: ${album.releaseDate}`;
          albumElement.querySelector('.album-total-tracks').textContent = `Total Tracks: ${album.totalTracks}`;
          albumElement.querySelector('.play-album-button').addEventListener('click', () => {
            const albumId = album.spotifyUri.split(':').pop();
            window.open(`https://open.spotify.com/album/${albumId}`, '_blank');
          });
          albumsContainer.appendChild(albumElement);
        });
      })
      .catch(error => console.error('Error fetching albums:', error));
  });
</script>
